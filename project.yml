# XcodeGen 프로젝트 정의:  brew install xcodegen  →  xcodegen generate  →  open Dulleobang.xcodeproj
name: Dulleobang
options:
  bundleIdPrefix: kr.ac.cau.dulleobang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko                # 시스템 UI(RoomPlan 촬영 안내 · 공유 시트 · 사진 선택 등)를 한국어로
settings:
  base:
    SWIFT_VERSION: "5.0"                 # Swift 6 엄격 동시성 대신 Swift 5 모드 (경고만)
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: "338ZGXYZ43"       # 서명 팀 ID (다른 팀원은 Xcode › Signing 에서 본인 팀으로 바꾸거나 여기를 수정)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  # 소셜 로그인 SDK (Swift Package Manager). 최소 버전 = 2026-11-19 최신
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.1.0
  KakaoSDK:
    url: https://github.com/kakao/kakao-ios-sdk
    from: 2.30.0
targets:
  Dulleobang:
    type: application
    platform: iOS
    sources:
      - path: Dulleobang
        excludes:
          - "Resources/Viewer/**"
          - "Resources/Mock/**"
      - path: Dulleobang/Resources/Viewer
        type: folder                     # 폴더 참조(파란 폴더) → 번들 안에 Viewer/ 로 복사
        buildPhase: resources
      - path: Dulleobang/Resources/Mock
        type: folder                     # 데모 데이터(mock_seed.json · 사진) → 번들 안에 Mock/ 로 복사
        buildPhase: resources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: KakaoSDK
        product: KakaoSDKCommon
      - package: KakaoSDK
        product: KakaoSDKAuth
      - package: KakaoSDK
        product: KakaoSDKUser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.ac.cau.dulleobang.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Dulleobang/Info.plist
      properties:
        CFBundleDisplayName: 둘러방
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true       # 세로 고정 앱 — 'All interface orientations must be supported' 경고 끄기
        NSCameraUsageDescription: 매물 공간과 가구를 3D 로 만들기 위해 카메라로 촬영합니다.
        NSLocalNetworkUsageDescription: 같은 Wi-Fi 의 개발 서버에 촬영 데이터를 올리기 위해 로컬 네트워크에 접속합니다.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # 개발용: http 팀 서버(IP 주소라 예외 도메인으로 못 넣음)와 로컬 서버. 서버가 https 가 되면 제거
          # NSAllowsLocalNetworking 은 넣지 않는다: 이 키가 있으면 iOS 가 NSAllowsArbitraryLoads 를 무시해서 http 팀 서버에 못 붙는다
        UIFileSharingEnabled: true       # 파일 앱에서 captures/ 의 zip 을 꺼낼 수 있게
        LSSupportsOpeningDocumentsInPlace: true
        # 소셜 로그인 (백엔드 공유 11.19). 클라이언트 ID · 네이티브 앱 키는 앱에 들어가는 공개 식별자다 (비밀 키 아님)
        GIDClientID: 374940312385-1bnqte0lr6vjbamfio46l1e0n6krb1p7.apps.googleusercontent.com
        GIDServerClientID: 374940312385-1gci36b0bov13nmcv69dt681iv9mdv9t.apps.googleusercontent.com   # 웹 클라이언트 → 구글 ID 토큰의 aud (서버가 검증)
        KakaoNativeAppKey: ee6e39d72b2898c409cb7a02634b7712
        CFBundleURLTypes:
          - CFBundleURLName: google-signin
            CFBundleURLSchemes: [com.googleusercontent.apps.374940312385-1bnqte0lr6vjbamfio46l1e0n6krb1p7]
          - CFBundleURLName: kakao-login
            CFBundleURLSchemes: [kakaoee6e39d72b2898c409cb7a02634b7712]
        LSApplicationQueriesSchemes: [kakaokompassauth, kakaolink]   # 카카오톡으로 로그인 · 카카오톡 설치 확인
  DulleobangTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DulleobangTests]
    dependencies:
      - target: Dulleobang
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dulleobang:
    build:
      targets:
        Dulleobang: all
        DulleobangTests: [test]
    run:
      config: Debug
      # iOS 27 의 RealityKit(RoomPlan 화면)이 Metal API 검증에 걸려 멈추는 문제 회피 (Apple 프레임워크 쪽 문제)
      enableGPUValidationMode: false
      enableGPUFrameCaptureMode: disabled
    test:
      targets: [DulleobangTests]
